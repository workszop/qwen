<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mały model w przeglądarce · edulab</title>
  <meta name="description" content="Qwen3.5 0.8B running locally in the browser on WebGPU. An educational playground for temperature, top-k, top-p, repetition penalty, thinking mode, system prompts and non-English prompts." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <style>
    @keyframes boot-reveal { to { visibility: visible; } }
    html:not(.app-ready) body { visibility: hidden; animation: boot-reveal 0s 4s forwards; }
    @media print { html:not(.app-ready) body { visibility: visible; animation: none; } }
  </style>
  <noscript><style>html:not(.app-ready) body { visibility: visible; animation: none; }</style></noscript>

  <style>
    /* ============================================================
       edulab - Colors & Type foundation (tokens/colors_and_type.css)
       ============================================================ */
    :root {
      --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
      --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

      --paper:    #FFFFFF;
      --paper-2:  #F5F3F0;
      --paper-3:  #EAE6E0;
      --surface:  #FFFFFF;

      --ink:      #1C1917;
      --ink-2:    #44403C;
      --ink-3:    #625B53;
      --line:     #E0DBD3;
      --line-2:   #C9C2B7;
      --line-strong: #857C69;

      --yellow:      #FFD500;
      --yellow-600:  #F0C800;
      --yellow-soft: #FFD500;
      --yellow-ink:  #1C1917;

      --blue:      #1E8FC2;
      --blue-600:  #177AA8;
      --blue-soft: #177AA8;
      --blue-ink:  #FFFFFF;

      --green:      #00A651;
      --green-600:  #078342;
      --green-soft: #078342;
      --green-ink:  #FFFFFF;

      --red:      #E5322D;
      --red-600:  #C92823;
      --red-soft: #C92823;
      --red-ink:  #FFFFFF;

      --grape:      #7A5AC2;
      --grape-soft: #7A5AC2;
      --grape-ink:  #FFFFFF;

      --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
      --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
      --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
      --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

      --play-sun:    #FFD500;
      --play-grass:  #00A651;
      --play-berry:  #C6478B;
      --play-grape:  #7A5AC2;
      --play-sky:    #1E8FC2;
      --play-coral:  #E5322D;

      --success:      #00A651;  --success-soft: #078342;  --success-ink: #FFFFFF;
      --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
      --danger:       #E5322D;  --danger-soft:  #C92823;  --danger-ink:  #FFFFFF;
      --info:         #1E8FC2;  --info-soft:    #177AA8;  --info-ink:    #FFFFFF;

      --bg:        var(--paper);
      --fg:        var(--ink);
      --fg-muted:  var(--ink-2);
      --primary:   var(--yellow);
      --on-primary:#1C1917;
      --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
      --track: color-mix(in srgb, var(--ink) 24%, transparent);

      --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
      --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
      --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

      --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

      --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
      --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
      --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
      --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
      --shadow-marigold: var(--shadow-primary);

      --display-font:  clamp(48px, 6vw, 72px);
      --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
      --body-lg: 18px; --body: 16px; --body-sm: 14px;
      --caption: 13px; --overline: 12px;
    }

    .edu-display, :where(.edu) h1.display { font-family: var(--font-display); font-weight: 700; font-size: var(--display-font); line-height: 1.02; letter-spacing: -0.025em; color: var(--ink); }
    :where(.edu) h1, .edu-h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--h1); line-height: 1.06; letter-spacing: -0.02em; color: var(--ink); }
    :where(.edu) h2, .edu-h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--h2); line-height: 1.12; letter-spacing: -0.015em; color: var(--ink); }
    :where(.edu) h3, .edu-h3 { font-family: var(--font-display); font-weight: 700; font-size: var(--h3); line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); }
    :where(.edu) h4, .edu-h4 { font-family: var(--font-sans); font-weight: 700; font-size: var(--h4); line-height: 1.3; color: var(--ink); }
    :where(.edu) p, .edu-p, .edu-body { font-family: var(--font-sans); font-weight: 400; font-size: var(--body); line-height: 1.6; color: var(--ink-2); }
    .edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
    .edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
    .edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }
    .edu-overline { font-family: var(--font-mono); font-weight: 500; font-size: var(--overline); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
    :where(.edu) code, .edu-mono { font-family: var(--font-mono); font-size: 0.92em; color: var(--ink); background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs); }
    .edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p, .edu-block li, .edu-block small { color: inherit; }
    body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }


    /* ============================================================
       Base
       ============================================================ */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    /* App workbench: full viewport width with gutters (reading pages keep the 1100px column) */
    :root { --gutter: clamp(16px, 4vw, 72px); }   /* side margin: ~4% of the viewport, 16px on phones */
    main { flex: 1; width: 100%; margin: 0; padding: 0 var(--gutter) 70px; }
    :focus-visible { outline: 3px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .ic { width: 18px; height: 18px; flex: none; }
    button { font: inherit; cursor: pointer; }

    /* ============================================================
       Branded top menu with nav
       ============================================================ */
    .edu-header { position: sticky; top: 0; z-index: 50; width: 100%; background: var(--paper); border-bottom: 1px solid var(--line-2); }
    .edu-header-inner { width: 100%; padding: 8px var(--gutter); display: flex; align-items: center; gap: 12px; }
    .edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
    .edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
    .nav { display: flex; gap: 4px; margin-left: 18px; }
    .nav-toggle { display: none; margin-left: auto; }
    .nav-btn { border: none; background: transparent; color: var(--ink-2); font-family: var(--font-sans); font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: var(--r-pill); display: inline-flex; align-items: center; gap: 8px; transition: background-color .15s ease; }
    .nav-btn:hover { background: var(--paper-2); color: var(--ink); }
    .nav-btn.active { background: var(--yellow); color: var(--yellow-ink); }
    .edu-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); margin-left: auto; }
    .nav-toggle + .edu-seg { margin-left: 0; }
    .edu-seg button { border: none; background: transparent; padding: 7px 14px; border-radius: var(--r-pill); font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--ink-2); }
    .edu-seg button.active { background: var(--yellow); color: var(--yellow-ink); }

    /* ============================================================
       Page header
       ============================================================ */
    .page-head { padding: 40px 0 28px; text-align: left; border-bottom: 1px solid var(--line-2); margin-bottom: 26px; }
    .app-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 5vw, 3.3rem); letter-spacing: -.025em; line-height: 1.05; color: var(--ink); margin: 0 0 14px; }
    .edu-lead { font-size: 1.15rem; line-height: 1.6; color: var(--ink-2); margin: 0; }

    /* ============================================================
       Cards, badges, tones, chips
       ============================================================ */
    .card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; }
    .card-head { padding: 14px 22px; background: var(--paper-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card-head h3 { margin: 0; font-size: 20px; }
    .card-body { padding: 20px 22px; flex: 1; }
    .card-foot { padding: 14px 22px; border-top: 1px dashed var(--line-2); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tile-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .tile-h h3 { margin: 0; font-size: 18px; line-height: 1.3; }
    .tone-grape  { background: var(--grape-soft);  color: var(--grape-ink); }
    .tone-blue   { background: var(--blue-soft);   color: var(--blue-ink); }
    .tone-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
    .tone-green  { background: var(--green-soft);  color: var(--green-ink); }
    .tone-red    { background: var(--red-soft);    color: var(--red-ink); }
    .tone-ink    { background: var(--ink);         color: var(--paper); }
    .tone-stone  { background: var(--paper-3);     color: var(--ink); }
    .badge { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
    .badge-lg { width: 46px; height: 46px; border-radius: var(--r-md); }
    .badge-lg .ic { width: 24px; height: 24px; }
    .badge.tone-ink { color: var(--yellow); }
    .edu-chip { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: var(--r-pill); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .edu-chip .ic { width: 13px; height: 13px; }

    /* ============================================================
       Buttons
       ============================================================ */
    .edu-btn { font-family: var(--font-display); font-weight: 600; font-size: 1rem; background: var(--yellow); color: var(--on-primary); border: none; border-radius: var(--r-pill); padding: 12px 22px; box-shadow: var(--shadow-primary); display: inline-flex; align-items: center; gap: 8px; transition: background-color .15s ease, transform .12s cubic-bezier(.32,.72,.32,1); }
    .edu-btn:hover  { background: var(--yellow-600); }
    .edu-btn:active { transform: scale(.96); }
    .edu-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 10px 18px; font-family: var(--font-display); font-weight: 600; font-size: .95rem; display: inline-flex; align-items: center; gap: 8px; transition: background-color .15s ease; }
    .btn-ghost:hover { background: var(--paper-2); }
    .btn-ghost:disabled { opacity: .45; cursor: not-allowed; }
    .btn-danger { background: var(--red-soft); color: var(--red-ink); border: none; }
    .btn-danger:hover { background: var(--red-600); }
    .btn-icon { padding: 10px 12px; }
    .btn-sm { padding: 7px 14px; font-size: .85rem; }

    /* ============================================================
       Model bar
       ============================================================ */
    .model-bar .card-head { flex-wrap: wrap; }
    .model-bar .card-body { padding: 14px 22px; }
    .model-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .progress { height: 10px; border-radius: var(--r-pill); background: var(--paper-3); overflow: hidden; }
    .progress > span { display: block; height: 100%; width: 0; background: var(--yellow); border-radius: var(--r-pill); transition: width .25s ease; }
    .progress-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
    .progress-meta b { color: var(--ink); font-weight: 500; }
    .callout { border-radius: var(--r-md); padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start; }
    .callout p { margin: 0; font-size: 15px; line-height: 1.5; }
    .callout .ic { margin-top: 2px; }

    /* ============================================================
       Workbench: panels + composer
       ============================================================ */
    .bench { margin-top: 20px; }
    .panels { display: grid; grid-template-columns: 1fr; gap: 18px; }
    body[data-compare="1"] .panels { grid-template-columns: 1fr 1fr; }
    .panel { min-height: 420px; }
    .panel .card-head { align-items: flex-start; }
    .panel-title { display: flex; align-items: center; gap: 10px; }
    .panel-title .letter { font-family: var(--font-display); font-weight: 800; font-size: 16px; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
    .panel-summary { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .panel-summary .edu-overline { margin: 0; font-size: 11px; }
    .panel-summary .sum { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); letter-spacing: .02em; line-height: 1.5; }
    .panel-summary .sum b { color: var(--ink); font-weight: 500; }
    .panel-summary .sys { font-size: 13px; color: var(--ink-2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .panel-summary .variant { font-size: 13px; color: var(--ink); line-height: 1.4; }
    .panel-summary .variant .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-right: 6px; }
    .messages { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 320px; max-height: 62vh; overflow-y: auto; }
    .msg { max-width: 88%; padding: 12px 15px; border-radius: var(--r-lg); line-height: 1.55; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--yellow-soft); color: var(--yellow-ink); border-bottom-right-radius: var(--r-xs); }
    .msg.assistant { align-self: flex-start; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-bottom-left-radius: var(--r-xs); box-shadow: var(--shadow-sm); }
    .msg.assistant.error { background: var(--red-soft); color: var(--red-ink); border-color: var(--red-soft); }
    .msg img { max-width: 220px; border-radius: var(--r-md); display: block; margin-bottom: 8px; border: 1px solid var(--line-2); }
    .msg .think { margin: 0 0 10px; border-radius: var(--r-sm); background: var(--paper-2); border: 1px solid var(--line-2); font-size: 14px; color: var(--ink-2); }
    .msg .think summary { padding: 8px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); list-style: none; display: flex; align-items: center; gap: 8px; }
    .msg .think summary::-webkit-details-marker { display: none; }
    .msg .think .think-body { padding: 0 12px 10px; white-space: pre-wrap; }
    .msg .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line-2); font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--ink-3); }
    .msg.assistant.error .meta { border-color: rgba(255,255,255,.4); color: var(--red-ink); }
    .msg.empty { align-self: stretch; max-width: none; background: var(--paper-2); color: var(--ink-2); border: 1px dashed var(--line-2); text-align: center; padding: 26px 18px; font-size: 15px; }
    .cursor::after { content: "▍"; color: var(--ink-3); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .composer-card { margin-top: 18px; }
    .composer { padding: 14px 22px; display: flex; gap: 10px; align-items: flex-end; }
    .composer textarea { flex: 1; min-height: 46px; max-height: 180px; resize: none; }
    .attach-preview { display: flex; align-items: center; gap: 10px; padding: 10px 22px 0; font-size: 13px; color: var(--ink-2); }
    .attach-preview img { width: 40px; height: 40px; object-fit: cover; border-radius: var(--r-xs); border: 1px solid var(--line-2); }
    .attach-preview button { margin-left: auto; }
    .composer-card .card-foot { background: var(--paper-2); font-size: 13px; color: var(--ink-3); }
    .kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: var(--r-xs); color: var(--ink); background: var(--surface); }
    .input, textarea.input { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); font: inherit; font-size: 15px; background: var(--surface); color: var(--ink); resize: vertical; }
    .input::placeholder { color: var(--ink-3); }

    /* ============================================================
       Sheets (dialogs): experiments, settings, glossary
       ============================================================ */
    dialog.sheet { border: none; padding: 0; background: transparent; max-width: min(860px, calc(100vw - 32px)); width: 100%; max-height: calc(100vh - 48px); margin: 24px auto; }
    dialog.sheet::backdrop { background: rgba(28,25,23,.45); }
    dialog.sheet .card { max-height: calc(100vh - 48px); }
    dialog.sheet .card-body { overflow-y: auto; }
    .sheet-close { background: transparent; border: 1px solid var(--line-strong); border-radius: var(--r-pill); width: 36px; height: 36px; display: inline-grid; place-items: center; color: var(--ink); }
    .sheet-close:hover { background: var(--paper-3); }

    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .tiles .card-body p { margin: 0; font-size: 15px; }
    .tiles .card-head h3 { font-size: 17px; }
    .tiles .card-foot { justify-content: space-between; }
    .tiles .ab { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); line-height: 1.6; margin: 12px 0 0; }
    .tiles .ab b { color: var(--ink); font-weight: 500; }

    .settings-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
    .settings-top .lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); margin-right: 10px; }
    .pgroup { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .pgroup:last-child { border-bottom: none; }
    .pgroup-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .pgroup-h .edu-overline { margin: 0; }
    .pgroup-h .badge { width: 28px; height: 28px; border-radius: var(--r-xs); }
    .pgroup-h .badge .ic { width: 15px; height: 15px; }
    .field { margin: 10px 0 0; }
    .field-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .field label, .field .label { font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--ink); }
    .field .val { font-family: var(--font-mono); font-size: 13px; color: var(--ink); font-weight: 500; min-width: 3.5ch; text-align: right; font-variant-numeric: tabular-nums; }
    .field .hint { margin: 6px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-3); }
    input[type="range"] { width: 100%; height: 8px; -webkit-appearance: none; appearance: none; background: var(--track); border-radius: var(--r-pill); margin: 8px 0 2px; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); box-shadow: var(--shadow-sm); cursor: pointer; }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); box-shadow: var(--shadow-sm); cursor: pointer; }
    input[type="range"]:disabled { opacity: .4; }
    .num { width: 92px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-xs); font-family: var(--font-mono); font-size: 14px; color: var(--ink); background: var(--surface); }
    .switch { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); }

    const EXPERIMENTS = [

        en: { title: "Thinking off versus on", body: "A answers right away, B reasons first. Reasoning can be long: if B eats the whole token budget, raise it in settings.", prompt: "I had 3 apples, ate one and bought 5 pears. How many pieces of fruit do I have?" } },
      { id: "memory", tone: "grape", icon: "timer",

        en: { title: "Limit 25 versus 250 tokens", body: "The same answer cut mid-sentence in A and completed in B. The token limit is scissors, not a request for brevity.", prompt: "Describe Warsaw." } },

    const GLOSSARY = {
      pl: [
        ["Prompt systemowy", "Instrukcja przed rozmową: rola, język, styl, ograniczenia.", "Każ odpowiadać wyłącznie po angielsku i wyślij pytanie po polsku."],
        ["Pamięć rozmowy", "Czy poprzednie tury trafiają do promptu. Dłuższy prompt = wolniej.", "Przedstaw się, potem zapytaj o swoje imię z pamięcią i bez."],
        ["Tryb myślenia", "Model pisze rozumowanie przed odpowiedzią (blok <think>).", "Zadanie arytmetyczne z myśleniem i bez."],
        ["Dekodowanie", "Deterministyczne (greedy) = zawsze najbardziej prawdopodobny token. Losowe = próbkowanie z rozkładu.", "To samo pytanie ×3 w obu trybach."],
        ["Temperatura", "Spłaszcza (wysoka) lub wyostrza (niska) rozkład prawdopodobieństw przed losowaniem.", "0.3 kontra 1.8 na kreatywnym zadaniu."],

        ["Obraz", "Model jest wielomodalny: obraz zamienia się na tokeny wizyjne (448×448).", "Dołącz zdjęcie i poproś o opis po polsku."],
        ["Ziarno losowości (seed)", "Niedostępne w tej bibliotece: losowanie korzysta z Math.random, więc wyników z losowaniem nie da się odtworzyć.", "Użyj dekodowania deterministycznego, gdy potrzebujesz powtarzalności."],
      ],
      en: [
        ["System prompt", "Instruction before the conversation: role, language, style, limits.", "Order English-only answers and send a Polish question."],
        ["Conversation memory", "Whether previous turns go into the prompt. Longer prompt = slower.", "Introduce yourself, then ask for your name with and without memory."],
        ["Thinking mode", "The model writes reasoning before the answer (a <think> block).", "An arithmetic task with and without thinking."],
        ["Decoding", "Deterministic (greedy) = always the most likely token. Random = sampling from the distribution.", "Same question ×3 in both modes."],
        ["Temperature", "Flattens (high) or sharpens (low) the probability distribution before sampling.", "0.3 versus 1.8 on a creative task."],
        ["Max tokens", "Hard limit on answer length.", "25 tokens and ask for a city description."],
        ["Image", "The model is multimodal: an image becomes vision tokens (448×448).", "Attach a photo and ask for a description in Polish."],
        ["Random seed", "Not available in this library: sampling uses Math.random, so random results cannot be reproduced.", "Use deterministic decoding when you need repeatability."],
      ],
    };

    // ─── State ───
    const S = {
      lang: "pl",
      status: "idle",            // idle | loading | compiling | ready | generating | error
      compare: 0,
      editing: "a",
      processor: null, model: null,
      panels: { a: { ...PANEL_DEFAULT, history: [] }, b: { ...PANEL_DEFAULT, history: [] } },
      attached: null,
      stopper: null, abortRun: false,
      progress: {},
    };

    // ─── DOM refs ───
    const $ = (id) => document.getElementById(id);
    const el = {
      body: document.body, live: $("live"),
      modelChip: $("modelChip"), modelBody: $("modelBody"), modelNote: $("modelNote"), btnLoad: $("btnLoad"),
      progressWrap: $("progressWrap"), progressBar: $("progressBar"), progressFile: $("progressFile"), progressPct: $("progressPct"),
      gpuWarn: $("gpuWarn"), loadError: $("loadError"), loadErrorText: $("loadErrorText"),
      panels: { a: document.querySelector('[data-panel="a"]'), b: document.querySelector('[data-panel="b"]') },
      chatState: $("chatState"), msgInput: $("msgInput"),
      btnSend: $("btnSend"), btnStop: $("btnStop"), btnRepeat: $("btnRepeat"), btnClear: $("btnClear"), btnCompare: $("btnCompare"),
      btnAttach: $("btnAttach"), btnDetach: $("btnDetach"), fileInput: $("fileInput"), attachPreview: $("attachPreview"), attachImg: $("attachImg"),
      dlgExp: $("dlgExp"), dlgSettings: $("dlgSettings"), dlgGloss: $("dlgGloss"),
      tiles: $("tiles"), glossBody: $("glossBody"),
      sysInput: $("sysInput"), tempInput: $("tempInput"), maxTok: $("maxTok"), variantInput: $("variantInput"), variantGroup: $("variantGroup"), btnReset: $("btnReset"), panelPick: $("panelPick"),
    };

    // ─── Helpers ───
    const t = (key) => T[S.lang][key] ?? T.pl[key] ?? key;
    const fmtMB = (b) => (b / 1e6).toFixed(0) + " MB";
    const announce = (text) => { el.live.textContent = ""; setTimeout(() => { el.live.textContent = text; }, 30); };
    const icons = () => { if (window.lucide) lucide.createIcons(); };
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const activePanels = () => (S.compare ? ["a", "b"] : ["a"]);
    const sysOf = (p) => (p.sys && p.sys.trim()) ? p.sys.trim() : SYS_DEFAULT[S.lang];
    const localized = (v) => (v && typeof v === "object") ? v[S.lang] : v;

    function setStatus(status) {
      S.status = status;
      el.body.dataset.state = status;
      const chipKey = { idle: "stateIdle", loading: "stateLoading", compiling: "stateCompiling", ready: "stateReady", generating: "stateReady", error: "stateError" }[status];
      el.modelChip.textContent = t(chipKey);
      el.modelChip.className = "edu-chip " + ({ ready: "tone-green", generating: "tone-green", error: "tone-red", idle: "tone-stone" }[status] || "tone-yellow");
      const ready = status === "ready";
      el.chatState.textContent = t(status === "generating" ? "chatGen" : ready ? "chatReady" : "chatIdle");
      el.chatState.className = "edu-chip " + (status === "generating" ? "tone-yellow" : ready ? "tone-green" : "tone-stone");
      el.btnLoad.hidden = ready || status === "generating";
      el.modelNote.hidden = ready || status === "generating";
      el.btnLoad.disabled = status === "loading" || status === "compiling";
      el.btnSend.hidden = status === "generating";
      el.btnStop.hidden = status !== "generating";
      el.btnRepeat.disabled = !ready;
      el.btnAttach.disabled = !ready;
      el.msgInput.disabled = !(ready || status === "generating");
      updateSendState();
    }

    function updateSendState() {
      const hasText = el.msgInput.value.trim() !== "";
      el.btnSend.disabled = !(S.status === "ready" && (hasText || S.attached));
    }

    function setCompare(on) {
      S.compare = on ? 1 : 0;
      el.body.dataset.compare = S.compare;
      el.panels.b.hidden = !S.compare;
      el.btnCompare.querySelector("span").textContent = t(S.compare ? "compareOff" : "compareOn");
      document.querySelectorAll("[data-sw-compare]").forEach((b) => b.classList.toggle("active", Number(b.dataset.swCompare) === S.compare));
      el.panelPick.hidden = !S.compare;
      el.variantGroup.hidden = !S.compare;
      if (!S.compare && S.editing === "b") { S.editing = "a"; }
      writeSettings();
      renderSummaries();
    }

    function buildGenerationOptions(p) {
      const sampling = Number(p.sample) === 1;
      const opts = { max_new_tokens: p.maxTok, do_sample: sampling };
      if (sampling) opts.temperature = p.temp;
      return opts;
    }

    function splitThinking(text) {
      const idx = text.indexOf("</think>");
      if (idx === -1) return { think: text, answer: "", open: true };
      return { think: text.slice(0, idx).replace(/^<think>\s*/, "").trim(), answer: text.slice(idx + 8).replace(/^\s+/, ""), open: false };
    }

    // ─── Render ───
    function applyI18n() {
      document.documentElement.lang = S.lang;
      el.body.dataset.lang = S.lang;
      document.title = (S.lang === "pl" ? "Mały model w przeglądarce" : "A small model in the browser") + " · edulab";
      document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
      document.querySelectorAll("[data-i18n-html]").forEach((n) => { n.innerHTML = t(n.dataset.i18nHtml); });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((n) => { n.placeholder = t(n.dataset.i18nPlaceholder); });
      document.querySelectorAll("[data-lang-btn]").forEach((b) => b.classList.toggle("active", b.dataset.langBtn === S.lang));
      setStatus(S.status);
      setCompare(S.compare);
      renderTiles();
      renderGlossary();
      icons();
    }

    function summaryOf(p) {
      const parts = [];
      parts.push(Number(p.sample) ? `<b>${t("sumRand")}</b> · ${t("sumT")} <b>${Number(p.temp).toFixed(1)}</b>` : `<b>${t("sumDet")}</b>`);
      parts.push(`${t("sumMax")} <b>${p.maxTok}</b>`);
      if (Number(p.memory)) parts.push(`<b>${t("sumMem")}</b>`);
      if (Number(p.thinking)) parts.push(`<b>${t("sumThink")}</b>`);
      return parts.join(" · ");
    }

    function renderSummaries() {
      for (const id of ["a", "b"]) {
        const p = S.panels[id]; const node = el.panels[id];
        node.querySelector("[data-sum]").innerHTML = summaryOf(p);
        node.querySelector("[data-sys]").textContent = sysOf(p);
        const v = node.querySelector("[data-variant]");
        v.hidden = !(p.variant && p.variant.trim());
        v.innerHTML = `<span class="lbl">${t("variant")}</span>${escapeHtml(p.variant || "")}`;
        node.dataset.params = JSON.stringify({ sample: p.sample, temp: p.temp, maxTok: p.maxTok, memory: p.memory, thinking: p.thinking, sys: sysOf(p), variant: p.variant || "" });
      }
      el.body.dataset.params = JSON.stringify({ compare: S.compare, a: JSON.parse(el.panels.a.dataset.params), b: JSON.parse(el.panels.b.dataset.params) });
    }

    function writeSettings() {
      const p = S.panels[S.editing];
      document.querySelectorAll("[data-pick]").forEach((b) => b.classList.toggle("active", b.dataset.pick === S.editing));
      el.sysInput.value = p.sys; el.sysInput.placeholder = SYS_DEFAULT[S.lang];
      el.tempInput.value = p.temp; el.maxTok.value = p.maxTok; el.variantInput.value = p.variant || "";
      for (const name of ["memory", "thinking", "sample"]) {
        document.querySelectorAll(`[data-sw="${name}"]`).forEach((b) => b.classList.toggle("active", Number(b.dataset.val) === Number(p[name])));
      }
      $("tempVal").textContent = Number(p.temp).toFixed(1);
      const sampling = Number(p.sample) === 1;
      document.querySelectorAll("[data-needs-sample]").forEach((f) => { f.classList.toggle("disabled-note", !sampling); f.querySelectorAll("input").forEach((i) => { i.disabled = !sampling; }); });
    }

    function readSettings() {
      const p = S.panels[S.editing];
      p.sys = el.sysInput.value;
      p.temp = parseFloat(el.tempInput.value);
      p.maxTok = Math.max(1, parseInt(el.maxTok.value, 10) || 1);
      p.variant = el.variantInput.value;
      $("tempVal").textContent = p.temp.toFixed(1);
      renderSummaries();
    }

    function renderTiles() {
      el.tiles.innerHTML = EXPERIMENTS.map((x) => {
        const c = x[S.lang];
        const desc = (side) => summaryOf({ ...PANEL_DEFAULT, ...side }).replace(/<\/?b>/g, "");
        return `<article class="card" data-exp="${x.id}">
          <div class="card-head"><span class="tile-h"><span class="badge tone-${x.tone}"><i data-lucide="${x.icon}" class="ic" aria-hidden="true"></i></span><h3>${escapeHtml(c.title)}</h3></span></div>
          <div class="card-body"><p>${escapeHtml(c.body)}</p><p class="ab"><b>A</b> ${desc(x.a)}<br><b>B</b> ${desc(x.b)}</p></div>
          <div class="card-foot"><button class="edu-btn btn-sm" type="button" data-apply="${x.id}"><i data-lucide="flask-conical" class="ic" aria-hidden="true"></i><span>${t("apply")}</span></button></div>
        </article>`;
      }).join("");
    }

    function renderGlossary() {
      el.glossBody.innerHTML = GLOSSARY[S.lang].map((r) => `<tr><td>${escapeHtml(r[0])}</td><td>${escapeHtml(r[1])}</td><td>${escapeHtml(r[2])}</td></tr>`).join("");
    }

    function renderProgress() {
      const files = Object.values(S.progress);
      const loaded = files.reduce((a, f) => a + (f.loaded || 0), 0);
      const total = files.reduce((a, f) => a + (f.total || 0), 0);
      const pct = total ? Math.min(100, Math.round(loaded / total * 100)) : 0;
      el.progressBar.querySelector("span").style.width = pct + "%";
      el.progressBar.setAttribute("aria-valuenow", pct);
      el.progressPct.textContent = pct + "%";
      el.progressFile.textContent = total ? `${fmtMB(loaded)} / ${fmtMB(total)}` : "…";
      el.body.dataset.progress = pct;
    }

    function messagesOf(id) { return el.panels[id].querySelector("[data-messages]"); }

    function addUserMessage(id, text, image) {
      const box = messagesOf(id);
      box.querySelector("[data-empty]").hidden = true;
      const node = document.createElement("div");
      node.className = "msg user"; node.dataset.role = "user";
      if (image) { const img = document.createElement("img"); img.src = image.dataURL; img.alt = ""; node.appendChild(img); }
      node.appendChild(document.createTextNode(text));
      box.appendChild(node);
      box.scrollTop = box.scrollHeight;
    }

    function addAssistantMessage(id) {
      const box = messagesOf(id);
      const node = document.createElement("div");
      node.className = "msg assistant"; node.dataset.role = "assistant"; node.dataset.done = "0";
      node.innerHTML = `<details class="think" hidden><summary><i data-lucide="brain" class="ic" aria-hidden="true"></i>${t("thinkLabel")}</summary><div class="think-body"></div></details><div class="body cursor"></div><div class="meta" hidden></div>`;
      box.appendChild(node);
      icons();
      box.scrollTop = box.scrollHeight;
      return node;
    }

    function renderAssistant(node, fullText, thinking, done) {
      const body = node.querySelector(".body");
      const thinkEl = node.querySelector(".think");
      if (thinking) {
        const { think, answer, open } = splitThinking(fullText);
        thinkEl.hidden = false;
        thinkEl.querySelector(".think-body").textContent = think;
        thinkEl.open = open && !done ? true : (open ? thinkEl.open : false);
        body.textContent = answer;
      } else {
        thinkEl.hidden = true;
        body.textContent = fullText;
      }
      body.classList.toggle("cursor", !done);
      const box = node.parentElement; box.scrollTop = box.scrollHeight;
    }

    function finishMessage(node, p, { tokens, seconds, stopped, error }) {
      node.dataset.done = "1";
      node.querySelector(".body").classList.remove("cursor");
      const meta = node.querySelector(".meta");
      meta.hidden = false;
      const parts = [];
      if (error) { node.classList.add("error"); node.querySelector(".body").textContent = error; }
      if (tokens != null) { parts.push(`${tokens} ${t("mTokens")}`); node.dataset.tokens = tokens; }
      if (seconds != null) parts.push(`${seconds.toFixed(1)} ${t("mTime")}`);
      if (tokens != null && seconds > 0) { const tps = tokens / seconds; parts.push(`${tps.toFixed(1)} ${t("mTps")}`); node.dataset.tps = tps.toFixed(1); }
      if (stopped) parts.push(t("stopped"));
      parts.push(Number(p.sample) ? `T ${p.temp}` : t("sumDet"));
      meta.innerHTML = parts.map((x) => `<span>${escapeHtml(x)}</span>`).join("");
    }

    // ─── Model loading ───
    async function loadModel() {
      el.modelBody.hidden = false;
      if (!navigator.gpu) { el.gpuWarn.hidden = false; return; }
      el.loadError.hidden = true;
      el.progressWrap.hidden = false;
      S.progress = {};
      renderProgress();
      setStatus("loading");
      const progress_callback = (ev) => {
        if (!ev || !ev.file) return;
        if (ev.status === "initiate" || ev.status === "download") { S.progress[ev.file] = S.progress[ev.file] || { loaded: 0, total: 0 }; }
        if (ev.status === "progress") { S.progress[ev.file] = { loaded: ev.loaded || 0, total: ev.total || 0 }; }
        if (ev.status === "done") { const f = S.progress[ev.file]; if (f && f.total) f.loaded = f.total; }
        renderProgress();
      };
      try {
        S.processor = await AutoProcessor.from_pretrained(MODEL_ID, { progress_callback });
        S.model = await Qwen3_5ForConditionalGeneration.from_pretrained(MODEL_ID, { dtype: DTYPE, device: "webgpu", progress_callback });
        setStatus("compiling");
        el.progressFile.textContent = t("stateCompiling");
        const warm = S.processor.apply_chat_template([{ role: "user", content: [{ type: "text", text: "Hi" }] }], { add_generation_prompt: true, enable_thinking: false });
        const warmInputs = await S.processor(warm);
        await S.model.generate({ ...warmInputs, max_new_tokens: 1 });
        el.progressWrap.hidden = true;
        el.modelBody.hidden = true;
        setStatus("ready");
        announce(t("liveLoaded"));
        el.msgInput.focus();
      } catch (err) {
        console.error(err);
        el.loadErrorText.textContent = t("errLoad") + (err && err.message ? err.message : String(err));
        el.loadError.hidden = false;
        el.progressWrap.hidden = true;
        setStatus("error");
      }
    }

    // ─── Generation ───
    async function generateInPanel(id, text, image) {
      const p = S.panels[id];
      const thinking = Number(p.thinking) === 1;
      const memory = Number(p.memory) === 1;
      const userText = (p.variant && p.variant.trim()) ? p.variant.trim() : text;

      addUserMessage(id, userText, image);
      const messages = [{ role: "system", content: [{ type: "text", text: sysOf(p) }] }];
      if (memory) messages.push(...p.history);
      const content = [];
      if (image) content.push({ type: "image" });
      content.push({ type: "text", text: userText });
      messages.push({ role: "user", content });

      const node = addAssistantMessage(id);
      S.stopper = new InterruptableStoppingCriteria();
      const t0 = performance.now();
      let full = "";
      try {
        const prompt = S.processor.apply_chat_template(messages, { add_generation_prompt: true, enable_thinking: thinking });
        const inputs = image ? await S.processor(prompt, [image.raw]) : await S.processor(prompt);
        const inputLen = inputs.input_ids.dims.at(-1);
        const streamer = new TextStreamer(S.processor.tokenizer, {
          skip_prompt: true, skip_special_tokens: true,
          callback_function: (chunk) => { full += chunk; renderAssistant(node, full, thinking, false); },
        });
        const out = await S.model.generate({ ...inputs, ...buildGenerationOptions(p), streamer, stopping_criteria: S.stopper });
        const newTokens = out.dims.at(-1) - inputLen;
        const stopped = S.stopper.interrupted === true;
        renderAssistant(node, full, thinking, true);
        finishMessage(node, p, { tokens: newTokens, seconds: (performance.now() - t0) / 1000, stopped });
        if (memory) {
          const answer = thinking ? splitThinking(full).answer : full;
          p.history.push({ role: "user", content: [{ type: "text", text: userText }] });
          p.history.push({ role: "assistant", content: [{ type: "text", text: answer }] });
        }
      } catch (err) {
        console.error(err);
        finishMessage(node, p, { error: String(err && err.message || err), seconds: (performance.now() - t0) / 1000 });
      } finally {
        S.stopper = null;
      }
    }

    async function sendFromComposer(times = 1) {
      const text = el.msgInput.value.trim();
      const image = S.attached;
      if ((!text && !image) || S.status !== "ready") return;
      el.msgInput.value = "";
      el.msgInput.style.height = "auto";
      detachImage();
      setStatus("generating");
      S.abortRun = false;
      try {
        for (let i = 0; i < times && !S.abortRun; i++) {
          for (const id of activePanels()) {
            if (S.abortRun) break;
            await generateInPanel(id, text, i === 0 ? image : null);
          }
        }
      } finally {
        setStatus("ready");
        announce(t("liveDone"));
        el.msgInput.focus();
      }
    }

    function stop() { S.abortRun = true; if (S.stopper) S.stopper.interrupt(); }

    function clearChat() {
      for (const id of ["a", "b"]) {
        messagesOf(id).querySelectorAll(".msg:not(.empty)").forEach((n) => n.remove());
        messagesOf(id).querySelector("[data-empty]").hidden = false;
        S.panels[id].history = [];
      }
      detachImage();
    }

    function detachImage() {
      S.attached = null;
      el.fileInput.value = "";
      el.attachPreview.hidden = true;
      updateSendState();
    }

    function applyExperiment(id) {
      const x = EXPERIMENTS.find((e) => e.id === id);
      if (!x) return;
      for (const side of ["a", "b"]) {
        const set = { ...x[side] };
        if (set.sys != null) set.sys = localized(set.sys);
        S.panels[side] = { ...PANEL_DEFAULT, ...set, history: [] };
      }
      S.editing = "a";
      setCompare(1);
      el.msgInput.value = x[S.lang].prompt;
      el.msgInput.dispatchEvent(new Event("input"));
      el.body.dataset.experiment = id;
      el.dlgExp.close();
      document.querySelector(".composer-card").scrollIntoView({ behavior: "smooth", block: "end" });
      setTimeout(() => el.msgInput.focus({ preventScroll: true }), 400);
    }

    function resetPanel() {
      S.panels[S.editing] = { ...PANEL_DEFAULT, history: [] };
      delete el.body.dataset.experiment;
      writeSettings(); renderSummaries();
    }

    function openSheet(id, panel) {
      if (panel) { S.editing = panel; writeSettings(); }
      document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.open === id));
      $(id).showModal();
    }

    // ─── Listeners ───
    const btnMenu = $("btnMenu");
    const setMenu = (open) => { el.body.dataset.menu = open ? "1" : "0"; btnMenu.setAttribute("aria-expanded", String(!!open)); };
    btnMenu.addEventListener("click", () => setMenu(el.body.dataset.menu !== "1"));
    document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => { setMenu(false); openSheet(b.dataset.open); }));
    document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openSheet("dlgSettings", b.dataset.edit)));
    document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));
    document.querySelectorAll("dialog.sheet").forEach((d) => {
      d.addEventListener("close", () => document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active")));
      d.addEventListener("click", (e) => { if (e.target === d) d.close(); });
    });
    document.querySelectorAll("[data-lang-btn]").forEach((b) => b.addEventListener("click", () => {
      S.lang = b.dataset.langBtn;
      try { localStorage.setItem(LANG_KEY, S.lang); } catch (_) {}
      applyI18n();
    }));
    document.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => { S.editing = b.dataset.pick; writeSettings(); }));
    document.querySelectorAll("[data-sw-compare]").forEach((b) => b.addEventListener("click", () => setCompare(Number(b.dataset.swCompare))));
    document.querySelectorAll("[data-sw]").forEach((b) => b.addEventListener("click", () => {
      const p = S.panels[S.editing];
      p[b.dataset.sw] = Number(b.dataset.val);
      if (b.dataset.sw === "memory" && Number(b.dataset.val) === 0) p.history = [];
      writeSettings(); renderSummaries();
    }));
    for (const input of [el.sysInput, el.tempInput, el.maxTok, el.variantInput]) input.addEventListener("input", readSettings);
    el.btnReset.addEventListener("click", resetPanel);
    el.btnCompare.addEventListener("click", () => setCompare(!S.compare));
    el.btnLoad.addEventListener("click", loadModel);
    el.btnSend.addEventListener("click", () => sendFromComposer(1));
    el.btnRepeat.addEventListener("click", () => sendFromComposer(3));
    el.btnStop.addEventListener("click", stop);
    el.btnClear.addEventListener("click", clearChat);
    el.btnAttach.addEventListener("click", () => el.fileInput.click());
    el.btnDetach.addEventListener("click", detachImage);
    el.tiles.addEventListener("click", (e) => { const b = e.target.closest("[data-apply]"); if (b) applyExperiment(b.dataset.apply); });

    el.fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const dataURL = URL.createObjectURL(file);
      const raw = await RawImage.read(dataURL);
      S.attached = { raw: await raw.resize(IMAGE_SIZE, IMAGE_SIZE), dataURL };
      el.attachImg.src = dataURL;
      el.attachPreview.hidden = false;
      if (!el.msgInput.value.trim()) el.msgInput.value = t("describeImage");
      updateSendState();
    });

    el.msgInput.addEventListener("input", () => {
      updateSendState();
      el.msgInput.style.height = "auto";
      el.msgInput.style.height = Math.min(180, el.msgInput.scrollHeight) + "px";
    });
    el.msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!el.btnSend.disabled) sendFromComposer(1); }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && S.status === "generating") { e.preventDefault(); stop(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "l" && S.status === "ready") { e.preventDefault(); clearChat(); }
    });

    // ─── Init ───
    try { const saved = localStorage.getItem(LANG_KEY); if (saved === "pl" || saved === "en") S.lang = saved; } catch (_) {}
    applyI18n();
    writeSettings();
    renderSummaries();
    if (!navigator.gpu) { el.modelBody.hidden = false; el.gpuWarn.hidden = false; }

    // ─── Reveal ───
    Promise.race([
      Promise.all(BRAND_FONTS.map((f) => document.fonts.load(f).catch(() => null))),
      new Promise((r) => setTimeout(r, FONT_WAIT_MS)),
    ]).then(() => document.documentElement.classList.add("app-ready"));
  </script>
</body>
</html>
